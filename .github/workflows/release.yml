name: Build and Release ZEN Study Downloader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pyinstaller

      - name: Download yt-dlp.exe
        run: |
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "server/yt-dlp.exe"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onefile --name="ZEN_Downloader" --clean server/zen_server.py

      - name: Package Release ZIP
        run: |
          mkdir release_package
          mkdir release_package/chrome_extension
          Copy-Item -Path "dist/ZEN_Downloader.exe" -Destination "release_package/"
          Copy-Item -Path "server/yt-dlp.exe" -Destination "release_package/"
          Copy-Item -Path "chrome_extension/*" -Destination "release_package/chrome_extension/" -Recurse
          Copy-Item -Path "README.md" -Destination "release_package/使い方説明書.md"
          Compress-Archive -Path "release_package/*" -DestinationPath "ZEN_Study_Downloader_v1.0.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ZEN_Study_Downloader_v1.0.zip
