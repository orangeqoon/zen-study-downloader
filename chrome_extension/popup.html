<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ZEN Study Downloader</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #38bdf8;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: auto;
    }
    .status-online {
      background: #065f46;
      color: #34d399;
    }
    .status-offline {
      background: #881337;
      color: #f43f5e;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    select, input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
    }
    select:focus, input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    button.save-btn {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.save-btn:hover {
      background: #0369a1;
    }
    .msg {
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ZEN Downloader</h1>
    <span id="status-indicator" class="status-badge status-offline">サーバー確認中</span>
  </div>

  <div class="form-group">
    <label for="quality">ダウンロード画質</label>
    <select id="quality">
      <option value="best">最高画質 (1080p 推奨)</option>
      <option value="720">高画質 (720p)</option>
      <option value="480">中画質 (480p)</option>
      <option value="360">低画質・軽量 (360p)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="download-folder">保存先フォルダ（絶対パス）</label>
    <input type="text" id="download-folder" placeholder="空欄でDownloads/ZEN_Study">
    <div class="hint">未入力の場合は「ダウンロード/ZEN_Study」に自動保存されます。</div>
  </div>

  <button class="save-btn" id="save-btn">設定を保存</button>
  <div id="msg" class="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
